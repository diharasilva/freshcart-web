<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FreshCart</title>
    
    <!-- CSS & PWA Manifest -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#28a745">

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('static', filename='service-worker.js') }}")
                    .then((reg) => console.log('Service Worker registered! Scope:', reg.scope))
                    .catch((err) => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</head>
<body>
    <!-- Top Navigation Header -->
    <header class="navbar">
        <div class="logo">
            <a href="{{ url_for('index') }}" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px;">
                <span class="logo-badge">F</span> <strong>FreshCart</strong>
            </a>
        </div>
        <nav class="nav-links">
            <a href="{{ url_for('index') }}">Shop</a>
            <a href="{{ url_for('cart') }}">Cart <span class="cart-count">{{ session.get('cart_count', 0) }}</span></a>
            {% if current_user and current_user.is_authenticated %}
                <a href="{{ url_for('logout') }}">Sign out</a>
            {% else %}
                <a href="{{ url_for('login') }}">Sign in</a>
                <a href="{{ url_for('register') }}" class="btn-account">Create account</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
