{% extends 'admin/base_admin.html' %}{% block title %}Categories{% endblock %}{% block admin_content %}<h1 class="section-title mb-3">Categories</h1><div class="panel p-4 mb-3"><form method="post" class="d-flex gap-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control" name="name" required maxlength="100" placeholder="New category name"><button class="btn btn-success">Add category</button></form></div><div class="panel table-responsive p-3"><table class="table"><thead><tr><th>Category</th><th>Products</th></tr></thead><tbody>{% for c in categories %}<tr><td>{{ c.name }}</td><td>{{ c.product_count }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
