{% extends 'admin/base_admin.html' %}{% block title %}Bulk promotion email{% endblock %}{% block admin_content %}<h1 class="section-title mb-3">Bulk promotion email</h1><div class="panel p-4"><p class="text-secondary">Sends to all registered customer accounts. In console mode, each message is printed in the server terminal.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Subject</label><input class="form-control mb-3" name="subject" maxlength="180" required><label class="form-label">Message</label><textarea class="form-control mb-3" name="body" rows="6" maxlength="4000" required></textarea><button class="btn btn-success" onclick="return confirm('Send this message to every registered customer?')">Send bulk email</button></form></div>{% endblock %}
