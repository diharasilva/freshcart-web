{% extends 'admin/base_admin.html' %}{% block title %}Edit product{% endblock %}{% block admin_content %}<h1 class="section-title mb-3">Edit product</h1><div class="panel p-4"><form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-6"><label class="form-label">Product name</label><input class="form-control" name="name" required maxlength="150" value="{{ product.name }}"></div><div class="col-md-3"><label class="form-label">Price (Rs.)</label><input class="form-control" type="number" min="0" step="0.01" name="price" required value="{{ product.price }}"></div><div class="col-md-3"><label class="form-label">Stock quantity</label><input class="form-control" type="number" min="0" name="stock_qty" required value="{{ product.stock_qty }}"></div><div class="col-md-4"><label class="form-label">Category</label><select class="form-select" name="category_id"><option value="">No category</option>{% for c in categories %}<option value="{{ c.id }}" {% if c.id==product.category_id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Aisle</label><input class="form-control" name="aisle" value="{{ product.aisle or '' }}"></div><div class="col-md-4"><label class="form-label">Shelf location</label><input class="form-control" name="shelf_location" value="{{ product.shelf_location or '' }}"></div><div class="col-md-4"><label class="form-label">Expiry date</label><input class="form-control" type="date" name="expiry_date" value="{{ product.expiry_date or '' }}"></div><div class="col-md-8"><label class="form-label">Image URL</label><input class="form-control" name="image_url" value="{{ product.image_url or '' }}"></div><div class="col-12"><button class="btn btn-success">Save changes</button> <a class="btn btn-outline-light" href="{{ url_for('admin_products') }}">Cancel</a></div></form></div>{% endblock %}
