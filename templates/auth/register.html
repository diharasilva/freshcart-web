{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-card"><p class="eyebrow">JOIN FRESHCART</p><h1>Create account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required maxlength="100"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required maxlength="190"><label class="form-label">Phone (optional)</label><input class="form-control mb-3" name="phone" maxlength="30"><label class="form-label">Birthday (optional)</label><input class="form-control mb-3" type="date" name="birthday"><label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><button class="btn btn-success w-100">Create account</button></form></div></div>{% endblock %}
